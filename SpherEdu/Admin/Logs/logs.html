<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs - Super Admin</title>
    <link rel="stylesheet" href="../../spheredu.css">
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>SUPER ADMIN</h2></div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="../Dashboard/dashboard.html">Dashboard</a></li>
                    <li><a href="../Cursos/cursos.html">Cursos</a></li>
                    <li><a href="../Regras/regras.html">Regras</a></li>
                    <li><a href="../Coordenadores/coordenadores.html">Coordenadores</a></li>
                    <li><a href="../Alunos/alunos.html">Alunos</a></li>
                    <li><a href="../Atividades/avaliar_atividades.html">Atividades</a></li>
                    <li><a href="logs.html" class="active">Logs</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer"><a href="../../Login/login.html">Sair</a></div>
        </aside>

        <main class="main-content">
            <header class="top-bar"></header>
            <section class="content-area">

                <div class="header-geral">
                    <h1>Logs do Sistema</h1>
                    <div class="filtros-bar">
                        <input
                            type="text"
                            id="input-busca"
                            class="input-busca"
                            placeholder="Buscar na mensagem..."
                        />
                        <select id="filtro-level" class="select-padrao">
                            <option value="">Todos os níveis</option>
                            <option value="info">Info</option>
                            <option value="warn">Warn</option>
                            <option value="error">Error</option>
                        </select>
                        <button class="btn-add" onclick="carregarLogs()">↻ Atualizar</button>
                    </div>
                </div>

                <p class="contador-logs" id="contador-logs"></p>

                <table class="table-geral" style="margin-top: 16px;">
                    <thead>
                        <tr>
                            <th>Data / Hora</th>
                            <th>Nível</th>
                            <th>Mensagem</th>
                            <th>Detalhes (meta)</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-logs"></tbody>
                </table>

            </section>
        </main>
    </div>

    <script src="../../Api.js"></script>
    <script src="logs.js"></script>
</body>
</html>
